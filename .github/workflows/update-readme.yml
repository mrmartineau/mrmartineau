name: Update README

on:
  schedule:
    # 07:15 UTC every Monday. Offset from the hour because GitHub delays
    # scheduled jobs that land on busy round-number slots.
    - cron: '15 7 * * 1'
  # Lets me trigger a refresh by hand, and lets the site repo trigger one
  # after a deploy if I ever wire that up.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate README sections
        run: node scripts/update-readme.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README from zander.wtf feeds"
          git push
